name: workpulse
description: "A lightweight, privacy-first, offline-first desktop time-tracking application for macOS and Windows."
publish_to: 'none'
version: 4.5.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0

  # Local Persistence & SQLite
  sqflite_common_ffi: ^2.4.2+1
  sqlite3: ^3.5.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Desktop Window & Tray Management
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.2.2

  # Native platform queries (system idle time via dart:ffi)
  ffi: ^2.1.4

  # Utilities & Formatting
  intl: ^0.20.3
  uuid: ^4.5.1
  equatable: ^2.0.7
  csv: ^8.0.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/

  # Bundled locally rather than fetched at runtime: WorkPulse makes zero
  # outbound network calls (AGENTS.md rule 8). Both families are SIL Open
  # Font License 1.1; the licences ship alongside the .ttf files.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
