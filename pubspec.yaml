name: workpulse
description: "A lightweight, privacy-first, offline-first macOS time-tracking application."
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Local Persistence & SQLite
  sqflite_common_ffi: ^2.4.2+1
  sqlite3: ^3.5.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # Desktop Window & Tray Management
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  screen_retriever: ^0.2.2

  # Utilities & Formatting
  intl: ^0.20.3
  uuid: ^4.5.1
  equatable: ^2.0.7
  csv: ^8.0.0

  # UI / Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
